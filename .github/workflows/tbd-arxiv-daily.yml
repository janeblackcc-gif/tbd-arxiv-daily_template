# This is a basic workflow to help you get started with Actions

name: Run Arxiv Papers Daily

on:
  workflow_dispatch:
  # GitHub cron is in UTC. 01:00 UTC = 09:00 Beijing Time (UTC+8)
  schedule:
    - cron: "0 1 * * *"

env:
  GITHUB_USER_NAME: janeblackcc
  GITHUB_USER_EMAIL: 1269538586@qq.com

jobs:
  build:
    name: update
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python Env
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install arxiv
          pip install requests
          pip install pyyaml

      # Snapshot old paper keys BEFORE updating, so we can compute "新增 X 篇"
      # Use JSON dict keys (paper_key) which are stable in this repo's data structure.
      - name: Snapshot old paper keys
        run: |
          python - <<'PY'
          import json, os

          path = "docs/cv-arxiv-daily.json"
          old = set()

          if os.path.exists(path) and os.path.getsize(path) > 0:
            try:
              with open(path, "r", encoding="utf-8") as f:
                data = json.load(f)
              if isinstance(data, dict):
                for _, papers in data.items():
                  if isinstance(papers, dict):
                    old.update(papers.keys())
            except Exception:
              pass

          with open("old_keys.txt", "w", encoding="utf-8") as f:
            for k in sorted(old):
              f.write(k + "\n")

          print("old_keys =", len(old))
          PY

      - name: Run daily arxiv
        run: |
          python daily_arxiv.py

      # Compute added count AFTER updating and export to next steps
      - name: Compute added count
        run: |
          python - <<'PY'
          import json, os

          def read_set(p):
            s=set()
            if os.path.exists(p):
              with open(p, "r", encoding="utf-8") as f:
                for line in f:
                  line=line.strip()
                  if line:
                    s.add(line)
            return s

          old = read_set("old_keys.txt")

          path = "docs/cv-arxiv-daily.json"
          new = set()
          if os.path.exists(path) and os.path.getsize(path) > 0:
            with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)
            if isinstance(data, dict):
              for _, papers in data.items():
                if isinstance(papers, dict):
                  new.update(papers.keys())

          added = len(new - old)

          env_path = os.environ.get("GITHUB_ENV")
          with open(env_path, "a", encoding="utf-8") as f:
            f.write(f"ADDED_COUNT={added}\n")

          print("added =", added)
          PY

      - name: Push updated files
        uses: github-actions-x/commit@v2.9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Github Action Automatic Update Arxiv Papers"
          files: README.md docs/cv-arxiv-daily.json docs/cv-arxiv-daily-web.json docs/index.md docs/cv-arxiv-daily-wechat.json docs/wechat.md
          rebase: "true"
          name: ${{ env.GITHUB_USER_NAME }}
          email: ${{ env.GITHUB_USER_EMAIL }}

      - name: Notify Feishu
        if: success()
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          ADDED_COUNT: ${{ env.ADDED_COUNT }}
        run: |
          python - <<'PY'
          import os, time, base64, hmac, hashlib, json, urllib.request

          webhook = os.environ.get("FEISHU_WEBHOOK", "").strip()
          if not webhook:
            raise SystemExit("Missing FEISHU_WEBHOOK secret")

          secret = os.environ.get("FEISHU_SECRET", "").strip()
          ts = int(time.time())

          repo = os.environ.get("GITHUB_REPOSITORY", "")
          run_id = os.environ.get("GITHUB_RUN_ID", "")
          run_url = f"https://github.com/{repo}/actions/runs/{run_id}" if repo and run_id else ""

          added = os.environ.get("ADDED_COUNT", "0")

          text = f"📡 雷达论文日报已更新 ✅\n新增 {added} 篇\n仓库：https://github.com/{repo}"
          if run_url:
            text += f"\n本次运行：{run_url}"

          body = {"msg_type": "text", "content": {"text": text}}

          # If you enabled "signature verification" in Feishu bot settings, provide FEISHU_SECRET.
          if secret:
            string_to_sign = f"{ts}\n{secret}".encode("utf-8")
            sign = base64.b64encode(hmac.new(string_to_sign, b"", hashlib.sha256).digest()).decode("utf-8")
            body.update({"timestamp": str(ts), "sign": sign})

          req = urllib.request.Request(
            webhook,
            data=json.dumps(body).encode("utf-8"),
            headers={"Content-Type": "application/json"}
          )
          with urllib.request.urlopen(req) as resp:
            print(resp.read().decode("utf-8"))
          PY
